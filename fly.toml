# Fly.io configuration for the Enigma backend (Express 5 + MongoDB).
# Docs: https://fly.io/docs/reference/configuration/
#
# App name + region are placeholders — either edit them here or let
# `fly launch` set them. Deploy with `fly deploy` once secrets are set (below).

app = 'enigma-api'
primary_region = 'iad' # change to the region nearest your MongoDB Atlas cluster

[build]
# Uses the Dockerfile in this directory (Fly auto-detects it).

# ── Non-secret runtime config. SECRETS (MONGODB_URL, CLERK_*, AWS_*, CLOUDFRONT_*)
#    are NOT set here — use `fly secrets set` so they never land in the repo. ──
[env]
  NODE_ENV = 'production'
  PORT = '8080'
  LOG_LEVEL = 'info'
  TRANSCRIBE_LANGUAGE = 'en-US'
  # Update both to your deployed frontend URL(s). CORS_ORIGINS is comma-separated.
  CORS_ORIGINS = 'https://your-frontend.example.com'
  APP_BASE_URL = 'https://your-frontend.example.com'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  # Keep 1 machine warm so the API (and its Mongo connection) doesn't cold-start.
  # Set to 0 to allow full scale-to-zero if you'd rather minimise cost.
  min_machines_running = 1
  processes = ['app']

  # Liveness/readiness check against the top-level /health route.
  [[http_service.checks]]
    interval = '15s'
    timeout = '3s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb' # bump to '1gb' if PDF/certificate generation (@react-pdf) OOMs
